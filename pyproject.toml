[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wgtools"
version = "0.3.0"
description = "WireGuard config file tools — parse client .conf files for server-side recovery"
requires-python = ">=3.11"

[project.scripts]
wgtools = "wgtools.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wgtools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
