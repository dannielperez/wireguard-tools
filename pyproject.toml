[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wgtools"
version = "0.3.0"
description = "WireGuard config file tools — parse client .conf files for server-side recovery"
requires-python = ">=3.11"

[project.scripts]
wgtools = "wgtools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
